<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you love me?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            font-family: 'Press Start 2P', monospace;
        }

        /* ========================================================= */
        /* Hamburger Menu Dropdown (ລຸ່ມຂວາ) - ສາຍ Pixel Retro Style */
        /* ========================================================= */
        .menu-wrapper {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        /* ປຸ່ມ Hamburger (ຂີດ 3 ຂີດ) Pixel Style */
        .hamburger-btn {
            width: 48px;
            height: 48px;
            background-color: #000000;
            color: #ffffff;
            border: 4px outset #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            box-shadow: 4px 4px 0px #1a1a1a;
            transition: all 0.1s ease;
        }

        .hamburger-btn:hover {
            background: #ffffff;
            border: 4px inset #ffffff;
            box-shadow: 2px 2px 0px #1a1a1a;
            transform: translate(2px, 2px);
        }

        .hamburger-btn .bar {
            width: 22px;
            height: 4px;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        .hamburger-btn:hover .bar {
            background-color: #000000;
        }

        /* ເມື່ອຄິກເປີດເມນູ ປ່ຽນ Icon ເປັນ X */
        .hamburger-btn.active .bar:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .hamburger-btn.active .bar:nth-child(2) {
            opacity: 0;
        }

        .hamburger-btn.active .bar:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        /* ລາຍການເມນູແບບເລື່ອນຂຶ້ນ-ລົງ */
        .menu-dropdown {
            list-style: none;
            margin-bottom: 12px;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition: all 0.2s ease;
        }

        .menu-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .menu-item a {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        /* ແຖບ Pixel Capsule ເກັບຂໍ້ຄວາມ */
        .menu-text {
            background-color: #000000;
            color: #ffffff;
            border: 3px outset #ffffff;
            padding: 8px 18px;
            min-width: 140px;
            text-align: center;
            font-size: 8pt;
            font-family: 'Press Start 2P', monospace;
            box-shadow: 3px 3px 0px #1a1a1a;
            transition: all 0.1s ease;
        }

        .menu-item a:hover .menu-text {
            background: #ffffff;
            color: #000000;
            border: 3px inset #ffffff;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #1a1a1a;
        }

        /* ========================================================= */

        .wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .pixel-window {
            background-color: #000000;
            border: 6px double #ffffff; 
            width: 400px;
            max-width: 90%;
            box-shadow: 12px 12px 0px #1a1a1a;
        }

        .window-bar {
            border-bottom: 4px solid #ffffff;
            padding: 10px;
            display: flex;
            gap: 6px;
        }

        .window-dot {
            width: 8px;
            height: 8px;
            border: 2px solid #ffffff;
        }

        .window-body {
            padding: 50px 20px;
            text-align: center;
        }

        .title-text {
            color: #ffffff;
            font-size: 13pt;
            line-height: 1.6;
            margin: 0 0 45px 0;
            font-weight: normal;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        .pixel-btn {
            background: transparent;
            color: #ffffff;
            border: 4px outset #ffffff; 
            padding: 12px 24px;
            font-size: 11pt;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            outline: none;
        }

        .pixel-btn:hover {
            background: #ffffff;
            color: #000000;
            border: 4px inset #ffffff; 
        }
        .pixel-smiler {
            display: none;
            color: #ffffff;
            font-size: 45pt;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
        }
        .neon-center-set {
            display: none;
            position: absolute;
            top: 53%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
            z-index: 6;
            user-select: none;
            pointer-events: none;
        }

        /* ປ່ຽນຂໍ້ຄວາມກາງຈໍໃຫ້ເປັນສີຂຽວ Neon ແຮັກເກີ */
        .neon-text {
            color: #00ff66;
            font-size: 26pt;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 
                0 0 5px #00ff66,
                0 0 15px #00ff66,
                0 0 30px #00cc44;
        }
        
        .neon-heart-svg {
            width: 140px;
            height: 140px;
            filter: drop-shadow(0 0 4px #00ff66)
                    drop-shadow(0 0 10px #00ff66)
                    drop-shadow(0 0 25px #00cc44)
                    drop-shadow(0 0 45px #00cc44);
        }

        .matrix-bg {
            display: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            overflow: hidden;
            z-index: 1;
            opacity: 0; 
            transition: opacity 0.2s ease;
        }

        /* ປ່ຽນໂຕໜັງສືທີ່ໄຫຼລົງມາໃຫ້ເປັນສີຂຽວແຮັກເກີ (Hacker Green Matrix) */
        .matrix-column {
            display: flex;
            flex-direction: column;
            white-space: nowrap;
            font-size: 13px; 
            line-height: 1.5;
            color: #00ff66;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.8);
            user-select: none;
        }

        .matrix-move {
            animation: scrollDown 10s linear infinite;
        }
        .matrix-column:nth-child(even) .matrix-move {
            animation: scrollDown 7s linear infinite;
        }

        @keyframes scrollDown {
            0% {
                transform: translateY(-50%);
            }
            100% {
                transform: translateY(0%);
            }
        }
    </style>
</head>
<body>

    <div class="wrapper" id="viewInterface">
        <div class="pixel-window" id="popupWindow">
            <div class="window-bar">
                <span class="window-dot"></span>
                <span class="window-dot"></span>
                <span class="window-dot"></span>
            </div>
            <div class="window-body">
                <h1 class="title-text">Do you love me?</h1>
                <div class="btn-container">
                    <button class="pixel-btn" onclick="triggerYes()">No</button>
                    <button class="pixel-btn" onclick="triggerNo()">Yes</button>
                </div>
            </div>
        </div>
    </div>

    <div class="pixel-smiler" id="smileContainer">:)</div>
    
    <div class="neon-center-set" id="neonSet" style="display: none;">
        <div class="neon-text">LOVE ME</div>
        
        <svg class="neon-heart-svg" viewBox="0 0 24 24" fill="#00ff66">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </div>

    <div class="matrix-bg" id="bgContainer"></div>

    <!-- Hamburger Menu (ຢູ່ລຸ່ມຂວາ) -->
    <div class="menu-wrapper">
        <ul class="menu-dropdown" id="menuDropdown">
            <li class="menu-item"><a href="dashboard.html"><span class="menu-text">Memory Box</span></a></li>
            <li class="menu-item"><a href="heart.html"><span class="menu-text">Heart </span></a></li>
            <li class="menu-item"><a href="non.html"><span class="menu-text">Do you Love me</span></a></li>
            <li class="menu-item"><a href="palina.html"><span class="menu-text">She is the light</span></a></li>
            <li class="menu-item"><a href="story.html"><span class="menu-text">Instagram</span></a></li>
        </ul>
        
        <button class="hamburger-btn" id="menuToggle" aria-label="Toggle Navigation">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </div>

    <script>
        const bgContainer = document.getElementById('bgContainer');

        function buildMatrixBackground() {
            bgContainer.innerHTML = '';
            
            const charWidth = 95; 
            const columnCount = Math.ceil(window.innerWidth / charWidth) + 1;
            
            let textBlock = "";
            for (let i = 0; i < 60; i++) {
                textBlock += "LOVE ME<br>";
            }

            for (let i = 0; i < columnCount; i++) {
                const col = document.createElement('div');
                col.className = 'matrix-column';
                
                const moveDiv = document.createElement('div');
                moveDiv.className = 'matrix-move';
                moveDiv.innerHTML = textBlock + textBlock;
                
                col.style.opacity = (Math.random() * 0.6 + 0.4).toFixed(2);
                moveDiv.style.animationDelay = (Math.random() * -10) + 's';

                col.appendChild(moveDiv);
                bgContainer.appendChild(col);
            }
        }

        window.addEventListener('resize', buildMatrixBackground);

        function triggerYes() {
            document.getElementById('viewInterface').style.display = 'none';
            document.getElementById('smileContainer').style.display = 'block';
        }

        function triggerNo() {
            const frame = document.getElementById('popupWindow');
            frame.style.transform = 'translate(4px, 4px)';
            setTimeout(() => frame.style.transform = 'translate(-4px, -4px)', 40);
            setTimeout(() => frame.style.transform = 'translate(4px, -4px)', 80);
            
            setTimeout(() => {
                document.getElementById('viewInterface').style.display = 'none';
                
                buildMatrixBackground();
                bgContainer.style.display = 'flex';
                setTimeout(() => bgContainer.style.opacity = '1', 10);
                document.getElementById('neonSet').style.display = 'flex';
            }, 130);
        }

        // ລະບົບເປີດ-ປິດ ເມນູ Hamburger 
        const menuToggle = document.getElementById('menuToggle');
        const menuDropdown = document.getElementById('menuDropdown');

        menuToggle.addEventListener('click', function() {
            this.classList.toggle('active');
            menuDropdown.classList.toggle('show');
        });

        // ປິດເມນູອັດໂນມັດເມື່ອຄິກຢູ່ບ່ອນອື່ນ
        document.addEventListener('click', function(e) {
            if (!menuToggle.contains(e.target) && !menuDropdown.contains(e.target)) {
                menuToggle.classList.remove('active');
                menuDropdown.classList.remove('show');
            }
        });
    </script>
</body>
</html>
