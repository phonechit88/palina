<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you love me? - Sweet Pink Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body {
            background-color: #12030b;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            font-family: 'Press Start 2P', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        /* ========================================================= */
        /* Hamburger Menu Dropdown - Sweet Pink Pixel Style */
        /* ========================================================= */
        .menu-wrapper {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .hamburger-btn {
            width: 48px;
            height: 48px;
            background-color: #1a0512;
            color: #ff66a3;
            border: 4px outset #ff3385;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            box-shadow: 4px 4px 0px #a60042;
            transition: all 0.15s ease;
            touch-action: manipulation;
        }

        .hamburger-btn:hover, .hamburger-btn:active {
            background: #ff3385;
            border: 4px inset #ffffff;
            box-shadow: 2px 2px 0px #a60042;
        }

        .hamburger-btn .bar {
            width: 22px;
            height: 4px;
            background-color: #ff66a3;
            transition: all 0.2s ease;
        }

        .hamburger-btn:hover .bar, .hamburger-btn:active .bar {
            background-color: #ffffff;
        }

        .hamburger-btn.active .bar:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .hamburger-btn.active .bar:nth-child(2) {
            opacity: 0;
        }

        .hamburger-btn.active .bar:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        .menu-dropdown {
            list-style: none;
            margin-bottom: 12px;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition: all 0.2s ease;
        }

        .menu-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .menu-item a {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .menu-text {
            background-color: #1a0512;
            color: #ffb3d1;
            border: 3px outset #ff3385;
            padding: 10px 18px;
            min-width: 140px;
            text-align: center;
            font-size: 8pt;
            font-family: 'Press Start 2P', monospace;
            box-shadow: 3px 3px 0px #a60042;
            transition: all 0.15s ease;
            touch-action: manipulation;
        }

        .menu-item a:hover .menu-text, .menu-item a:active .menu-text {
            background: #ff3385;
            color: #ffffff;
            border: 3px inset #ffffff;
            box-shadow: 1px 1px 0px #a60042;
        }

        /* ========================================================= */

        .wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .pixel-window {
            background-color: #1a0512;
            border: 6px double #ff3385; 
            width: 400px;
            max-width: 90%;
            box-shadow: 10px 10px 0px #a60042;
            will-change: transform;
        }

        .window-bar {
            border-bottom: 4px solid #ff3385;
            padding: 10px;
            display: flex;
            gap: 6px;
        }

        .window-dot {
            width: 8px;
            height: 8px;
            border: 2px solid #ff3385;
            background-color: #ff99c2;
        }

        .window-body {
            padding: 40px 20px;
            text-align: center;
        }

        .title-text {
            color: #ffffff;
            font-size: 13pt;
            line-height: 1.6;
            margin: 0 0 35px 0;
            font-weight: normal;
            text-shadow: 0 0 10px #ff3385;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        /* แก้ไข CSS ປຸ່ມໃຫ້ຮອງຮັບການ Touch ເທິງມືຖືໄດ້ 100% */
        .pixel-btn {
            background: transparent;
            color: #ffb3d1;
            border: 4px outset #ff3385; 
            padding: 14px 20px;
            min-height: 48px;
            min-width: 100px;
            font-size: 10pt;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            outline: none;
            box-shadow: 3px 3px 0px #a60042;
            transition: background-color 0.1s ease, border-color 0.1s ease;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ຍົກເລີກ transform: scale(0.98) ເພື່ອບໍ່ໃຫ້ຈຸດແຕະເຄື່ອນທີ່ */
        .pixel-btn:hover, .pixel-btn:active {
            background: #ff3385;
            color: #ffffff;
            border: 4px inset #ffffff;
            box-shadow: 0 0 14px #ff3385;
        }

        .pixel-smiler {
            display: none;
            color: #ff66a3;
            font-size: 45pt;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            text-shadow: 0 0 15px #ff3385, 0 0 30px #a60042;
        }

        .neon-center-set {
            display: none;
            position: absolute;
            top: 53%;
            left: 50%;
            transform: translate(-50%, -50%);
            flex-direction: column;
            align-items: center;
            gap: 0px;
            z-index: 6;
            user-select: none;
            pointer-events: none;
        }

        .neon-text {
            color: #ff4d94;
            font-size: 24pt;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 
                0 0 8px #ffb3d1,
                0 0 20px #ff3385,
                0 0 35px #cc0052;
        }
        
        .neon-heart-svg {
            width: 135px;
            height: 135px;
            filter: drop-shadow(0 0 10px #ff4d94)
                    drop-shadow(0 0 25px #ff3385)
                    drop-shadow(0 0 40px #a60042);
        }

        .matrix-bg {
            display: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            justify-content: space-around;
            overflow: hidden;
            z-index: 1;
            opacity: 0; 
            transition: opacity 0.3s ease;
        }

        .matrix-column {
            display: flex;
            flex-direction: column;
            white-space: nowrap;
            font-size: 13px; 
            line-height: 1.5;
            color: #ff66a3;
            text-shadow: 0 0 8px #ff3385;
            user-select: none;
        }

        .matrix-move {
            animation: scrollDown 10s linear infinite;
        }
        
        .matrix-column:nth-child(even) .matrix-move {
            animation: scrollDown 7s linear infinite;
        }

        @keyframes scrollDown {
            0% {
                transform: translateY(-50%);
            }
            100% {
                transform: translateY(0%);
            }
        }
    </style>
</head>
<body>

    <div class="wrapper" id="viewInterface">
        <div class="pixel-window" id="popupWindow">
            <div class="window-bar">
                <span class="window-dot"></span>
                <span class="window-dot"></span>
                <span class="window-dot"></span>
            </div>
            <div class="window-body">
                <h1 class="title-text">Do you love me?</h1>
                <div class="btn-container">
                    <button class="pixel-btn" id="btnNo">No</button>
                    <button class="pixel-btn" id="btnYes">Yes</button>
                </div>
            </div>
        </div>
    </div>

    <div class="pixel-smiler" id="smileContainer">:) T T</div>
    
    <div class="neon-center-set" id="neonSet">
        <div class="neon-text">LOVE YOU</div>
        
        <svg class="neon-heart-svg" viewBox="0 0 24 24" fill="#ff3385">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </div>

    <div class="matrix-bg" id="bgContainer"></div>

    <!-- Hamburger Menu -->
    <div class="menu-wrapper">
        <ul class="menu-dropdown" id="menuDropdown">
            <li class="menu-item"><a href="pn.html"><span class="menu-text">我的心❤️</span></a></li>
            <li class="menu-item"><a href="gift.html"><span class="menu-text">invite❤️</span></a></li>
            <li class="menu-item"><a href="yarpalina.html"><span class="menu-text">For palina❤️</span></a></li>
            <li class="menu-item"><a href="dashboard.html"><span class="menu-text">Memory Box❤️</span></a></li>
            <li class="menu-item"><a href="heart.html"><span class="menu-text">Heart❤️</span></a></li>
            <li class="menu-item"><a href="non.html"><span class="menu-text">Do you Love me❤️</span></a></li>
            <li class="menu-item"><a href="palina.html"><span class="menu-text">She is the light❤️</span></a></li>
            <li class="menu-item"><a href="story.html"><span class="menu-text">Instagram❤️</span></a></li>
        </ul>
        
        <button class="hamburger-btn" id="menuToggle" aria-label="Toggle Navigation">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </div>

    <script>
        const bgContainer = document.getElementById('bgContainer');

        function buildMatrixBackground() {
            bgContainer.innerHTML = '';
            
            const charWidth = 90; 
            const columnCount = Math.ceil(window.innerWidth / charWidth) + 1;
            
            let textBlock = "";
            for (let i = 0; i < 60; i++) {
                textBlock += "LOVE ME<br>";
            }

            for (let i = 0; i < columnCount; i++) {
                const col = document.createElement('div');
                col.className = 'matrix-column';
                
                const moveDiv = document.createElement('div');
                moveDiv.className = 'matrix-move';
                moveDiv.innerHTML = textBlock + textBlock;
                
                col.style.opacity = (Math.random() * 0.5 + 0.4).toFixed(2);
                moveDiv.style.animationDelay = (Math.random() * -10) + 's';

                col.appendChild(moveDiv);
                bgContainer.appendChild(col);
            }
        }

        window.addEventListener('resize', buildMatrixBackground);

        function handleNoAction() {
            document.getElementById('viewInterface').style.display = 'none';
            document.getElementById('smileContainer').style.display = 'block';
        }

        function handleYesAction() {
            const frame = document.getElementById('popupWindow');
            frame.style.transform = 'translate(4px, 4px)';
            setTimeout(() => frame.style.transform = 'translate(-4px, -4px)', 40);
            setTimeout(() => frame.style.transform = 'translate(4px, -4px)', 80);
            
            setTimeout(() => {
                document.getElementById('viewInterface').style.display = 'none';
                
                buildMatrixBackground();
                bgContainer.style.display = 'flex';
                setTimeout(() => bgContainer.style.opacity = '1', 10);
                document.getElementById('neonSet').style.display = 'flex';
            }, 130);
        }

        // ຜູກ Event Listeners ຜ່ານ JS ໂດຍກົງ ເພື່ອຮອງຮັບ Click/Tap ເທິງມືຖືໄດ້ 100%
        document.getElementById('btnNo').addEventListener('click', handleNoAction);
        document.getElementById('btnYes').addEventListener('click', handleYesAction);

        // Hamburger Menu
        const menuToggle = document.getElementById('menuToggle');
        const menuDropdown = document.getElementById('menuDropdown');

        menuToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('active');
            menuDropdown.classList.toggle('show');
        });

        document.addEventListener('click', function(e) {
            if (!menuToggle.contains(e.target) && !menuDropdown.contains(e.target)) {
                menuToggle.classList.remove('active');
                menuDropdown.classList.remove('show');
            }
        });
    </script>
</body>
</html>
